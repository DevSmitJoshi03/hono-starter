name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of letting them pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome — includes formatting)
        run: bun run lint

      - name: Test
        # Explicit `vitest run` rather than the watch-by-default `test` script.
        # Dummy env values for required vars come from vitest.config.ts.
        run: bunx vitest run
        env:
          NODE_ENV: test

      - name: Build
        run: bun run build
